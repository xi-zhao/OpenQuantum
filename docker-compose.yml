services:
  openquantum:
    build:
      context: .
      dockerfile: Dockerfile
    # Locally built image; the product version lives in package.json, not here.
    image: openquantum:local
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      DSH_PERMISSION_MODE: "${DSH_PERMISSION_MODE:-workspace-write}"
      DSH_TELEMETRY_MODE: DISABLED
    volumes:
      - openquantum-state:/workspace/.openquantum
      - openquantum-results:/workspace/results

volumes:
  openquantum-state:
  openquantum-results:
