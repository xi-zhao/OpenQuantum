[package]
name = "openquantum-qutip-wigner-case"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[lib]
name = "qutip_wigner_rust"
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.0", features = ["abi3-py312"] }

[build-dependencies]
pyo3-build-config = "=0.29.0"

[profile.release]
lto = "thin"
codegen-units = 1
