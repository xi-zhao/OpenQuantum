<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
  <title id="title">OpenQuantum — Building Trustworthy AI for Quantum Research</title>
  <desc id="desc">Stylized dark quantum interference wavefield banner with OpenQuantum tagline, compatible quantum SDKs, and measured optimization highlights.</desc>
  <defs>
    <clipPath id="card">
      <rect width="1200" height="600" rx="28" ry="28" />
    </clipPath>
    <radialGradient id="bg-glow-1" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#0b3a60" stop-opacity="0.95" />
      <stop offset="52%" stop-color="#061c34" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#030a14" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="bg-glow-cyan" cx="76%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#2de3ef" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#11bdd4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#030a14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-violet" cx="22%" cy="68%" r="38%">
      <stop offset="0%" stop-color="#7862ff" stop-opacity="0.24" />
      <stop offset="65%" stop-color="#5632e8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030a14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wave-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11bdd4" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#2de3ef" stop-opacity="0.48" />
      <stop offset="70%" stop-color="#7862ff" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#2de3ef" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="wave-soft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2de3ef" stop-opacity="0.03" />
      <stop offset="45%" stop-color="#2de3ef" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#7862ff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2de3ef" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7862ff" stop-opacity="0.5" />
    </linearGradient>
    <filter id="blur-node" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="600" fill="url(#bg-glow-1)" />
    <rect width="1200" height="600" fill="url(#bg-glow-cyan)" />
    <rect width="1200" height="600" fill="url(#bg-glow-violet)" />

    <!-- Stylized quantum wavefield interference strands -->
    <g fill="none">
      <path d="M -40 165 C 210 95, 420 250, 680 185 C 890 132, 1050 220, 1240 150" stroke="url(#wave-soft)" stroke-width="1.5" />
      <path d="M -40 215 C 180 285, 460 125, 720 225 C 930 305, 1080 165, 1240 230" stroke="url(#wave-cyan)" stroke-width="2" />
      <path d="M -40 270 C 240 180, 480 355, 760 250 C 960 175, 1090 315, 1240 260" stroke="url(#wave-soft)" stroke-width="1.3" />
      <path d="M -40 345 C 220 420, 470 255, 740 355 C 940 430, 1080 295, 1240 360" stroke="url(#wave-cyan)" stroke-width="1.8" />
      <path d="M -40 415 C 200 330, 440 480, 710 390 C 920 320, 1070 445, 1240 395" stroke="url(#wave-soft)" stroke-width="1.3" />
      <path d="M -40 465 C 250 510, 520 385, 810 460 C 990 505, 1110 420, 1240 475" stroke="url(#wave-soft)" stroke-width="1.1" />
    </g>

    <!-- Ambient phase nodes -->
    <g opacity="0.72">
      <circle cx="176" cy="148" r="10" fill="#2de3ef" opacity="0.32" filter="url(#blur-node)" />
      <circle cx="176" cy="148" r="2.8" fill="#d9fbff" />
      <circle cx="315" cy="108" r="12" fill="#7862ff" opacity="0.35" filter="url(#blur-node)" />
      <circle cx="315" cy="108" r="2.6" fill="#e8e4ff" />
      <circle cx="912" cy="136" r="11" fill="#2de3ef" opacity="0.38" filter="url(#blur-node)" />
      <circle cx="912" cy="136" r="3" fill="#e6fcff" />
      <circle cx="1038" cy="212" r="9" fill="#7862ff" opacity="0.34" filter="url(#blur-node)" />
      <circle cx="1038" cy="212" r="2.4" fill="#ece8ff" />
      <circle cx="148" cy="436" r="11" fill="#7862ff" opacity="0.35" filter="url(#blur-node)" />
      <circle cx="148" cy="436" r="2.6" fill="#ebe7ff" />
      <circle cx="984" cy="432" r="12" fill="#2de3ef" opacity="0.32" filter="url(#blur-node)" />
      <circle cx="984" cy="432" r="2.8" fill="#dffbff" />
      <circle cx="468" cy="492" r="8" fill="#2de3ef" opacity="0.28" filter="url(#blur-node)" />
      <circle cx="468" cy="492" r="2.2" fill="#d9fbff" />
      <circle cx="774" cy="482" r="8" fill="#7862ff" opacity="0.3" filter="url(#blur-node)" />
      <circle cx="774" cy="482" r="2.2" fill="#ebe7ff" />
    </g>

    <!-- Headline -->
    <text x="600" y="234" text-anchor="middle" fill="#f2f8fc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="650" letter-spacing="-1.6">
      Building Trustworthy AI
    </text>
    <text x="600" y="306" text-anchor="middle" fill="#f2f8fc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="650" letter-spacing="-1.6">
      for Quantum Research
    </text>

    <!-- Subtitle -->
    <text x="600" y="366" text-anchor="middle" fill="#a8c1d4" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="450">
      Qiskit · PennyLane · QuTiP · Stim · PyMatching · Lean 4 &amp; 122 pinned environments
    </text>

    <!-- Measured highlights pill (wide generous padding, accented metrics) -->
    <rect x="210" y="408" width="780" height="46" rx="23" fill="#061c34" fill-opacity="0.78" stroke="url(#pill-border)" stroke-width="1.2" />
    <text x="600" y="437" text-anchor="middle" fill="#d6edf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
      Measured Speedups: QuTiP <tspan fill="#2de3ef" font-weight="650">5.69×</tspan>  ·  PennyLane <tspan fill="#2de3ef" font-weight="650">5.09×</tspan>  ·  <tspan fill="#b3a6ff" font-weight="650">11 L3</tspan> Replayable Checks
    </text>

    <!-- Corner labels -->
    <text x="44" y="562" fill="#88a5bb" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.2">OPEN-SOURCE · MIT</text>
    <text x="1156" y="562" text-anchor="end" fill="#88a5bb" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.2">CODEX PLUGIN · DESKTOP</text>

    <!-- Subtle inner border for dark mode separation -->
    <rect x="0.75" y="0.75" width="1198.5" height="598.5" rx="27.25" ry="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
  </g>
</svg>
