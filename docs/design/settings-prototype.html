<script>

const DATA=JSON.parse(document.querySelector('#catalog-data').textContent);

const announce=text=>{$('#announcement').textContent=text;};
const categories={circuits:'电路与编译',hardware:'量子硬件',reference:'资料与查询',learning:'机器学习',dynamics:'动力学',chemistry:'量子化学',algorithms:'量子算法',error_correction:'量子纠错',other:'其他'};

const groupState=group=>{const saved=group.fields.filter(f=>isSaved(f.name));const defs=group.serverNames.map(getService).filter(Boolean);const missing=defs.some(s=>s.alternatives?!s.alternatives.some(set=>set.every(isSaved)):s.fields.some(f=>f.required&&!isSaved(f.name))||(s.pairs??[]).some(pair=>pair.some(isSaved)&&!pair.every(isSaved)));return {saved:saved.length,missing,label:missing?(saved.length?'待补全':'未配置'):saved.length?'已保存':'按需配置'};};
const items=()=>tab==='skills'?DATA.skills:DATA.servers;
const currentItem=()=>items().find(s=>s.id===selected)??store().connections.find(s=>s.id===selected);
function accountState(item){if(item.custom){if(item.authentication==='none')return {text:'无需账户',tone:'',action:'查看'};return {text:isSaved(`custom:${item.id}`)?'Token 已保存':'待配置 Token',tone:isSaved(`custom:${item.id}`)?'configured':'needs-account',action:isSaved(`custom:${item.id}`)?'管理':'配置'};}const groups=groupsFor(item);if(!groups.length)return {text:['qiskit','qiskit_docs'].includes(item.id)?'无需账户':'按需准备',tone:'',action:'查看'};const states=groups.map(groupState);if(states.every(s=>s.saved&&!s.missing))return{text:'凭据已保存',tone:'configured',action:'管理'};if(item.id==='fieldqkit')return{text:'按所选平台填 Token',tone:'needs-account',action:'配置'};if(item.id==='qcarchive_data')return{text:'待配置服务器',tone:'needs-account',action:'配置'};return{text:states.some(s=>s.saved)?'账户待补全':item.id==='superstaq_cloud'?'云端待填 Key':'云端待填 Token',tone:'needs-account',action:'配置'};}

function visibleItems(){return items().filter(matchesFilters).sort((a,b)=>{if(tab==='skills'){const ids=['pasqal-experiments','quantum-sdk-workbench','superstaq-compilation'];return (ids.indexOf(a.id)<0?999:ids.indexOf(a.id))-(ids.indexOf(b.id)<0?999:ids.indexOf(b.id));}return (priority.indexOf(a.id)<0?999:priority.indexOf(a.id))-(priority.indexOf(b.id)<0?999:priority.indexOf(b.id));});}
