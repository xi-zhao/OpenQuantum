<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" role="img" aria-labelledby="title description">
  <title id="title">OpenQuantum 公众号封面</title>
  <desc id="description">以 OpenQuantum 横版主标为主视觉的公众号封面</desc>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="900" y2="383" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eff8ff"/>
      <stop offset="0.56" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#f5f1ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b416d"/>
      <stop offset="0.5" stop-color="#00cddd"/>
      <stop offset="1" stop-color="#6747f4"/>
    </linearGradient>
    <linearGradient id="logo-navy" x1="38" y1="34" x2="138" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b416d"/>
      <stop offset="1" stop-color="#061f38"/>
    </linearGradient>
    <linearGradient id="logo-cyan" x1="36" y1="142" x2="166" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11bdd4"/>
      <stop offset="1" stop-color="#00d5e7"/>
    </linearGradient>
    <linearGradient id="logo-violet" x1="123" y1="103" x2="148" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7862ff"/>
      <stop offset="1" stop-color="#5632e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#082b49" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="383" fill="url(#cover)"/>
  <rect width="900" height="7" fill="url(#accent)"/>
  <g transform="translate(72 89) scale(1.05)" filter="url(#shadow)">
    <circle cx="88" cy="86" r="55" fill="none" stroke="url(#logo-navy)" stroke-width="22"/>
    <path d="M39 139C25 127 29 106 49 84C72 59 107 41 139 42C160 43 169 56 163 72C156 93 127 116 96 132C69 146 48 148 39 139Z" fill="none" stroke="url(#logo-cyan)" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
    <path d="M137 116L166 151" fill="none" stroke="url(#logo-cyan)" stroke-linecap="round" stroke-width="16"/>
    <circle cx="136" cy="115" r="13" fill="url(#logo-violet)"/>
    <text x="202" y="113" fill="#082b49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="74" font-weight="720" letter-spacing="-3.6">Open</text>
    <text x="384" y="113" fill="#05cadd" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="74" font-weight="720" letter-spacing="-3.6">Quantum</text>
  </g>
</svg>
