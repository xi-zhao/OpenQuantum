<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OpenQuantum Motion Stage</title>
<!--
  Deterministic motion stage for the OpenQuantum promo film and the README hero loop.
  render.py loads this page, calls window.render(t) for every frame and captures it.
  Abstract visuals (particles, strands, light) are illustration. Every measured value on screen comes
  from a record in this repository; README.md in this folder lists the sources and their limits.
-->

<body>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.search);
const MODE = params.get("mode") || "film";
const DPR = Number(params.get("dpr") || 1);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (p) => 1 - Math.pow(1 - p, 3);
const outQuint = (p) => 1 - Math.pow(1 - p, 5);
const inOut = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const mix = (a, b, p) => a + (b - a) * p;
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
// Text entrance: opacity, rise, blur and tracking all settle together.
function enter(el, t, a, b, { y = 30, blur = 8, s = 1, x = 0, track = null } = {}) {
  const p = outQuint(seg(t, a, b));
  el.style.opacity = p;
  el.style.transform = `translate(${mix(x, 0, p)}px, ${mix(y, 0, p)}px) scale(${mix(s, 1, p)})`;
  el.style.filter = blur ? `blur(${(1 - p) * blur}px)` : "none";
  if (track) el.style.letterSpacing = `${mix(track[0], track[1], p)}em`;
  return p;
}
function leave(el, t, a, b, { y = -16, s = 1.03 } = {}) {
  const p = inOut(seg(t, a, b)); if (p <= 0) return 0;
  el.style.opacity = Number(el.style.opacity) * (1 - p);
  el.style.transform += ` translateY(${y * p}px) scale(${mix(1, s, p)})`;
  el.style.filter = `blur(${p * 10}px)`;
  return p;
}

// ---------- canvas effects ----------
function makeSprite(r, stops) {
  const c = document.createElement("canvas"); c.width = c.height = r * 2;
  const g = c.getContext("2d"), grd = g.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, col]) => grd.addColorStop(o, col)); g.fillStyle = grd; g.fillRect(0, 0, r * 2, r * 2); return c;
}
const DOT = makeSprite(32, [[0, "rgba(255,255,255,1)"], [0.18, "rgba(170,245,252,.9)"], [0.45, "rgba(45,227,239,.25)"], [1, "rgba(45,227,239,0)"]]);
const VDOT = makeSprite(32, [[0, "rgba(255,255,255,1)"], [0.2, "rgba(200,190,255,.85)"], [0.5, "rgba(120,98,255,.25)"], [1, "rgba(120,98,255,0)"]]);

function background(ctx, W, H, t, { glowX = .5, glowY = .5, glow = 1 } = {}) {
  ctx.globalCompositeOperation = "source-over";
  const g = ctx.createRadialGradient(W * glowX, H * glowY, 0, W * glowX, H * glowY, W * .75);
  g.addColorStop(0, `rgba(11,65,109,${.75 * glow})`); g.addColorStop(.45, "rgba(6,31,56,.9)"); g.addColorStop(1, "#030a14");
  ctx.fillStyle = "#030a14"; ctx.fillRect(0, 0, W, H); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function vignette(ctx, W, H) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .72);
  g.addColorStop(0, "rgba(3,10,20,0)"); g.addColorStop(1, "rgba(3,10,20,.75)");
  ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// Particle field in 3D; camera depth `cz` wraps every DEPTH units so a loop can be seamless.
const DEPTH = 2800;
function makeField(n, W, H, seed = 7) {
  const r = rng(seed);
  return Array.from({ length: n }, () => ({ x: (r() * 2 - 1) * W * 1.1, y: (r() * 2 - 1) * H * 1.1, z: r() * DEPTH, v: r() < .18, s: .6 + r() * 1.2 }));
}
function drawField(ctx, pts, W, H, cz, alpha = 1, f = 620) {
  ctx.globalCompositeOperation = "lighter";
  for (const p of pts) {
    const z = ((p.z - cz) % DEPTH + DEPTH) % DEPTH + 60;
    const sx = W / 2 + (p.x * f) / z, sy = H / 2 + (p.y * f) / z;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    const near = clamp((z - 60) / 260), far = clamp((DEPTH - z) / 900);
    const a = alpha * near * far * (0.35 + 0.65 * (1 - z / DEPTH));
    if (a < .01) continue;
    const size = clamp((26 * f) / z * p.s, 2, 46);
    ctx.globalAlpha = a; ctx.drawImage(p.v ? VDOT : DOT, sx - size / 2, sy - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
}
// Glowing interference strands; all phases advance in whole turns over `period`.
function drawStrands(ctx, W, H, t, { period = 12, n = 26, alpha = 1, cy = .5, spread = .55, reveal = 1 } = {}) {
  const turn = (TAU * t) / period;
  ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  const x0 = W / 2 - (W / 2 + 40) * reveal, x1 = W / 2 + (W / 2 + 40) * reveal;
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    const amp = H * (.06 + .05 * Math.sin(i * .61 + 1.3)), f1 = 1.05 + .3 * Math.sin(i * .37), ph = i * .42;
    const base = H * (cy + (u - .5) * spread);
    ctx.beginPath();
    for (let k = 0; k <= 140; k++) {
      const x = mix(x0, x1, k / 140), xs = x / W;
      const pinch = Math.cos((xs - .5) * Math.PI) ** 2;            // strands gather toward the centre
      const y = base + (H * cy - base) * .55 * pinch + amp * Math.sin(TAU * f1 * xs + ph + turn) + amp * .45 * Math.sin(TAU * 2.3 * xs - ph * 1.7 - 2 * turn);
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    const a = (.05 + .1 * Math.sin(Math.PI * u) ** 2) * alpha;
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, `rgba(120,98,255,${a})`); g.addColorStop(.5, `rgba(45,227,239,${a * 1.6})`); g.addColorStop(1, `rgba(120,98,255,${a})`);
    ctx.strokeStyle = g; ctx.lineWidth = 6; ctx.globalAlpha = .35; ctx.stroke();
    ctx.lineWidth = 1.2; ctx.globalAlpha = 1; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

      enter($(".i4"), t, 8.5, 9.1, { y: 16 }); enter($(".i4b"), t, 8.95, 9.4, { y: 10, blur: 4 });
      [".i4", ".i4b"].forEach((c) => leave($(c), t, 9.85, 10.2));
      enter($(".i5"), t, 10.3, 10.9, { y: 16 }); enter($(".i5b"), t, 10.65, 11.1, { y: 10, blur: 4 }); enter($(".i5c"), t, 10.85, 11.3, { y: 6, blur: 0 });
      const ok = $(".i5ok"); ok.style.opacity = seg(t, 11.15, 11.25); ok.style.textShadow = `0 0 ${mix(30, 8, seg(t, 11.15, 11.8))}px rgba(45,227,239,.8)`;
      [".i5", ".i5b", ".i5c"].forEach((c) => leave($(c), t, 11.65, 12.0));
      enter($(".i6"), t, 12.0, 12.6, { y: 0, s: .7, blur: 10 }); $(".i6").style.filter += ` drop-shadow(0 0 ${mix(40, 14, seg(t, 12.2, 13.4))}px rgba(45,227,239,.45))`;
      enter($(".i7"), t, 12.2, 12.9, { y: 16 }); enter($(".i8"), t, 12.8, 13.3, { y: 12, blur: 6 });
      [".i6", ".i7", ".i8"].forEach((c) => leave($(c), t, 14.05, 14.4, { y: 0, s: 1.03 }));
    }

    // ---------- OPEN: questions cycle, then the main request is typed ----------
    let text = "", ci = -1;
    CAROUSEL.forEach(([q, a], i) => { if (t >= a && t < a + 1.2) { ci = i; text = q.slice(0, Math.round(q.length * seg(t, a, a + .5))); } });
    if (ci >= 0) { const qa = CAROUSEL[ci][1], out = seg(t, qa + 1.0, qa + 1.2); qEl.style.opacity = 1 - out; qEl.style.transform = `translateY(${-14 * out}px)`; qEl.style.filter = `blur(${out * 6}px)`; }
    else { qEl.style.opacity = 1; qEl.style.transform = "none"; qEl.style.filter = "none"; }
    if (t >= OP + 5.4) text = [...Q].filter((_, i) => qTime(i) <= t).join("");
    qEl.textContent = text;
    ph.style.opacity = t < OP + .6 ? 1 : 0;
    caret.style.opacity = (t > OP + .55 && t < OP + 7.0) || Math.floor(t / .5) % 2 === 0 ? 1 : 0;
    const askIn = outQuint(seg(t, OP + .1, OP + .7)), morph = inOut(seg(t, ST, ST + .6));
    if (t >= OP && t < ST + .6) {
      ask.style.display = "flex";
      ask.style.opacity = askIn * (1 - seg(t, ST + .3, ST + .6));
      ask.style.transform = `translate(${mix(0, bubble.x - W / 2, morph)}px, ${mix(mix(30, 0, askIn), bubble.y - H / 2, morph)}px) scale(${mix(1, bubble.w / 1240, morph)})`;
      ask.style.filter = `blur(${(1 - askIn) * 10}px)`;
    } else ask.style.display = "none";
    const lbl = $(".asklbl"); lbl.style.display = t >= OP && t < ST + .2 ? "block" : "none"; enter(lbl, t, OP + .2, OP + .8, { y: 8, blur: 4 }); leave(lbl, t, ST - .2, ST + .1);

    // ---------- STEPS + RESULT (workbench) ----------
    const T = t - O;
    const winIn = outQuint(seg(T, 4.25, 5.1)), winOut = inOut(seg(t, TH, TH + .8));
    win.style.opacity = winIn * (1 - winOut); win.style.filter = `blur(${winOut * 14}px)`;
    if (focus) {
      const inStep = inOut(seg(T, 5.0, 6.2)), toRes = inOut(seg(T, 9.4, 10.3)), back = outQuint(seg(t, TH - .05, TH + 1.0));
      const drift = seg(T, 6.2, 9.4) * 40;
      let fx = mix(W / 2, focus.steps.x, inStep), fy = mix(H / 2, focus.steps.y + drift, inStep), sc = mix(mix(1.04, 1, winIn), 1.26, inStep);
      fx = mix(fx, focus.res.x, toRes); fy = mix(fy, focus.res.y, toRes); sc = mix(sc, 1.34, toRes);
      fx = mix(fx, W / 2, back); fy = mix(fy, H / 2, back); sc = mix(sc, .62, back);
      setCam(sc, fx, fy);
    }
    enter($(".bubble"), T, 4.45, 4.9, { y: 0, blur: 0 }); enter($(".chip"), T, 4.75, 5.2, { y: 8, blur: 0 });
    enter($(".agent"), T, 5.15, 5.5, { y: 8, blur: 0 });
    enter($(".s1"), T, 5.4, 5.8, { y: 10, blur: 0 }); status($(".s1 .st"), T >= 6.4, T >= 5.4, T);
    enter($(".s2"), T, 6.5, 6.95, { y: 12, blur: 0 }); status($(".s2 .st"), T >= 8.9, T >= 6.5, T);
    $(".pill").textContent = T >= 8.9 ? "已完成" : "运行中"; $(".pill").classList.toggle("ok", T >= 8.9);
    $(".ev").textContent = `评估 ${Math.round(112 * outCubic(seg(T, 6.9, 8.85)))} 次`;
    $(".cv").style.opacity = seg(T, 8.85, 9.1);
    enter($(".s3"), T, 8.0, 8.4, { y: 10, blur: 0 }); status($(".s3 .st"), T >= 9.3, T >= 8.0, T);
    enter($(".res"), T, 9.55, 10.05, { y: 24, blur: 0, s: .98 });
    const roll = (el, txt, a, b) => { const p = seg(T, a, b), keep = Math.floor(p * txt.length); el.textContent = [...txt].map((ch, i) => (i < keep || !/[0-9]/.test(ch) ? ch : String((i * 7 + Math.floor(T * 30)) % 10))).join(""); };
    roll($(".r0"), "−1.85727503", 9.65, 10.35); roll($(".r1"), "−1.85727503", 9.8, 10.5);
    $$(".cell").forEach((c, i) => enter(c, T, 9.65 + i * .15, 10.05 + i * .15, { y: 14, blur: 0 }));
    enter($(".foot"), T, 10.7, 11.1, { y: 8, blur: 0 });
    $(".note").style.opacity = seg(T, 9.9, 10.4) * (1 - seg(t, TH - .2, TH + .1));

    // ---------- THEME: big · fast · verifiable · open, one word per beat ----------
    if (within(t, S.THEME)) {
      const u = t - TH;
      ["w0", "w1", "w2", "w3"].forEach((c, i) => { const el = $("." + c); enter(el, u, .3 + i * beat, .55 + i * beat, { y: 0, s: 1.12, blur: 10 }); leave(el, u, 2.7, 3.0, { y: 0, s: 1.03 }); });
    }
    // ---------- chapter cards ----------
    for (const id of Object.keys(CHAPTERS)) {
      if (!within(t, S[id])) continue;
      const u = t - at(id), sc = scenes[id];
      enter($(".ce", sc), u, .02, .3, { y: 6, blur: 4 }); enter($(".cg", sc), u, 0, .35, { y: 0, s: 1.15, blur: 14 });
      enter($(".cl1", sc), u, .25, .6, { y: 14, blur: 6 }); enter($(".cl2", sc), u, .4, .75, { y: 8, blur: 4 });
      $$(".ce, .cg, .cl1, .cl2", sc).forEach((e) => leave(e, u, .95, 1.2, { y: 0, s: 1.03 }));
    }
    // ---------- REACH ----------
    if (within(t, S.REACH)) {
      const u = t - at("REACH");
      enter($(".rc0"), u, .1, .5, { y: 8, blur: 4 }); enter($(".rc1"), u, .2, .9, { y: 24 });
      [[".k0", 186], [".k1", 91], [".k2", 114]].forEach(([c, v], i) => {
        const el = $(c); enter(el, u, .6 + i * .22, 1.1 + i * .22, { y: 20, blur: 6 });
        $("strong", el).textContent = Math.round(v * outExpo(seg(u, .6 + i * .22, 1.7 + i * .22)));
      });
      $$(".cat").forEach((el, i) => enter(el, u, 1.8 + i * .08, 2.2 + i * .08, { y: 12, blur: 4 }));
      $$("#REACH .center, #REACH .ctr, #REACH .cat").forEach((e) => leave(e, u, 3.9, 4.2));
    }
    // ---------- SKILLS: the wall of real Skills ----------
    if (within(t, S.SKILLS)) {
      const u = t - at("SKILLS");
      enter($(".sk0"), u, .05, .45, { y: 8, blur: 4 }); enter($(".sk1"), u, .1, .75, { y: 24 }); enter($(".sk2"), u, .5, 1.0, { y: 10, blur: 4 });
      enter($(".sk3"), u, 1.0, 1.4, { y: 0, blur: 0 });
      rows.forEach((row, r) => {
        const p = outQuint(seg(u, .3 + r * .15, 1.0 + r * .15));
        row.style.transform = `translate(${rowX(r, u)}px, ${(1 - p) * 40}px)`; row.style.opacity = p;
        $$(".sk", row).forEach((card, k) => card.classList.toggle("hot", k === hot[r] && u >= HOT_AT[r]));
      });
      $$("#SKILLS .center, #SKILLS .wrow").forEach((e) => leave(e, u, 4.5, 4.8, { y: 0, s: 1.01 }));
    }
    // ---------- PREP ----------
    if (within(t, S.PREP)) {
      const u = t - at("PREP");
      enter($(".pp0"), u, .1, .45, { y: 8, blur: 4 }); enter($(".pp1"), u, .15, .8, { y: 24 });
      ["n0", "n1", "n2"].forEach((c, i) => { const el = $("." + c); enter(el, u, .6 + i * .75, 1.05 + i * .75, { y: 30, blur: 6 }); el.classList.toggle("lit", u >= .6 + i * .75); });
      $$("#PREP .center, #PREP .node").forEach((e) => leave(e, u, 3.3, 3.6));
    }
    // ---------- paper case ----------
    if (within(t, S.CASES)) {
      $$(".case").forEach((el, i) => {
        const c = BREADTH[i], u = t - c.at, on = u >= -1e-6 && u < 3.6 + 1e-6;
        el.style.display = on ? "block" : "none"; if (!on) return;
        enter($(".ctag", el), u, .05, .45, { y: 0, x: -20, blur: 4 }); enter($(".cq", el), u, .1, .6, { y: 0, x: -30, blur: 6 });
        enter($(".csetup", el), u, .35, .8, { y: 8, blur: 4 });
        enter($(".cbig", el), u, 1.0, 1.25, { y: 0, s: 1.1, blur: 8 });
        enter($(".clabel", el), u, 1.25, 1.6, { y: 10, blur: 4 }); enter($(".csub", el), u, 1.45, 1.9, { y: 10, blur: 4 });
        enter($(".csrc", el), u, 1.6, 2.0, { y: 0, blur: 0 });
        const fig = $(".cfig", el); enter(fig, u, .4, 1.1, { y: 0, x: 60, blur: 6 }); fig.style.transform += ` perspective(1800px) rotateY(${mix(-10, -4, seg(u, .4, 3.6))}deg)`;
        $$(".abs", el).forEach((e) => leave(e, u, 3.3, 3.6, { y: 0, s: 1 }));
      });
    }
    // ---------- LEAN: what passes, what is rejected, what does not count ----------
    if (within(t, S.LEAN)) {
      const u = t - L;
      enter($(".ln0"), u, .1, .5, { y: 8, blur: 4 }); enter($(".ln1"), u, .2, .85, { y: 20 }); enter($(".ln2"), u, .6, 1.1, { y: 10, blur: 4 });
      enter($(".ln5"), u, 1.0, 1.5, { y: 0, blur: 0 });
      const lc = $(".lc"); enter(lc, u, .3, .9, { y: 0, x: 60, blur: 6 }); lc.style.transform += ` perspective(1800px) rotateY(${mix(-9, -4, seg(u, .3, 6))}deg)`;
      enter($(".fh", lc), u, .6, .9, { y: 0, blur: 0 });
      [0, 1, 2, 3].forEach((k) => { const l = $(".l" + k, lc); enter(l, u, .9 + k * .3, 1.15 + k * .3, { y: 0, x: -16, blur: 0 }); $("b", l).style.opacity = seg(u, 1.1 + k * .3, 1.2 + k * .3); });
      const l4 = $(".l4", lc), l5 = $(".l5", lc);
      enter(l4, u, 2.3, 2.5, { y: 0, x: -16, blur: 0 }); l4.style.background = `rgba(255,90,90,${.16 * Math.exp(-Math.max(0, u - 2.4) * 2.2) * (u >= 2.4 ? 1 : 0)})`;
      enter(l5, u, 4.1, 4.3, { y: 0, x: -16, blur: 0 }); l5.style.background = `rgba(255,200,90,${.12 * Math.exp(-Math.max(0, u - 4.2) * 2.2) * (u >= 4.2 ? 1 : 0)})`;
      enter($(".ln3"), u, 2.4, 2.85, { y: 0, x: -24, blur: 6 }); enter($(".ln4"), u, 4.2, 4.65, { y: 0, x: -24, blur: 6 });
      $$("#LEAN .abs").forEach((e) => leave(e, u, 5.65, 6.0, { y: 0, s: 1.01 }));
    }
    // ---------- OPEN SOURCE ----------
    if (within(t, S.OPENSRC)) {
      const u = t - at("OPENSRC");
      enter($(".os0"), u, .15, .55, { y: 8, blur: 4 });
      enter($(".os1"), u, .25, .9, { y: 20 }); enter($(".os2"), u, .5, 1.15, { y: 20 });
      enter($(".os3"), u, 1.1, 1.7, { y: 12, blur: 6 });
      enter($(".fd"), u, .45, 1.2, { y: 0, x: 70, blur: 6 });
      const list = $(".flist"), rowsEl = $$(".frow"), rowH = rowsEl[0].offsetHeight, view = $(".fwin").offsetHeight;
      const off = mix(0, Math.max(0, rowsEl.length * rowH - view + 20), inOut(seg(u, 1.0, 4.1)));
      list.style.transform = `translateY(${-off}px)`;
      rowsEl.forEach((r, i) => { const y = i * rowH - off; r.classList.toggle("hot", y > view - rowH * 2.2 && y < view - rowH * .2); });
      $$("#OPENSRC .abs, #OPENSRC .feed").forEach((e) => leave(e, u, 4.45, 4.8, { y: 0, s: 1.02 }));
    }
    // ---------- ENTRY ----------
    if (within(t, S.ENTRY)) {
      const u = t - at("ENTRY");
      enter($(".g0"), u, .1, .5, { y: 8, blur: 4 }); enter($(".g1"), u, .2, .9, { y: 24 });
      [["g2", -1, .55], ["g3", 1, .8]].forEach(([c, side, a]) => {
        const el = $("." + c), p = outQuint(seg(u, a, a + 1.0));
        el.style.opacity = p; el.style.filter = "none"; el.style.transform = `translate3d(${side * 160 * (1 - p)}px, ${40 * (1 - p)}px, ${-300 * (1 - p)}px) rotateY(${side * -14 * (1 - p) + side * -4}deg)`;
      });
      $$("#ENTRY .center, #ENTRY .glass").forEach((e) => leave(e, u, 3.3, 3.6, { y: 0, s: 1.03 }));
    }
    // ---------- END ----------
    if (within(t, S.END)) {
      const u = t - at("END");
      enter($(".lk"), u, .1, .9, { y: 0, s: .95, blur: 10 });
      $(".lk").style.filter += ` drop-shadow(0 0 ${mix(50, 16, seg(u, .2, 1.5))}px rgba(45,227,239,.35))`;
      enter($(".tg"), u, .7, 1.4, { y: 18, blur: 6 }); enter($(".un"), u, 1.2, 1.8, { y: 8, blur: 4 });
    }
    let fl = 0;
    for (const [h, g] of window.CUES.impacts) if (!NOFLASH.has(h)) fl = Math.max(fl, (t >= h ? Math.exp(-(t - h) * 7) : 0) * g * .6);
    flash.style.opacity = fl;
    redflash.style.opacity = t >= REJECT ? Math.exp(-(t - REJECT) * 3) : 0;
    fade.style.opacity = Math.max(1 - seg(t, 0, .4), inOut(seg(t, DUR - .8, DUR)));
  };
}

window.render = (t) => { renderFn(t); };
window.ready = Promise.all([document.fonts.load('500 64px "Inter"'), document.fonts.load('400 30px "JB Mono"'), document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {})), ...preload]).then(() => { renderFn(0); return true; });
</script>
