name: Publish update manifest

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-updates-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the versioned update manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: node scripts/build-update-manifest.mjs --tag "$RELEASE_TAG" --published-at "$RELEASE_DATE" --output .openquantum/release/openquantum-update.json
      - name: Attach the verified manifest to this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" .openquantum/release/openquantum-update.json --repo "$GITHUB_REPOSITORY" --clobber
