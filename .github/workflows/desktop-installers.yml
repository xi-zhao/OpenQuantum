name: DSH capability packages

# These checks are required for main, including documentation-only changes.
on:
  workflow_dispatch:
  push:
    branches: [main, 'c/desktop-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Capability package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install locked build dependencies
        run: npm ci
      - name: Check distribution upgrades and source integration
        run: npm run desktop:package:check
      - name: Build OpenQuantum capability archive for the original DSH Desktop
        run: npm run desktop:package
      - name: Verify archive and extract installation payload
        shell: bash
        run: |
          oq_artifacts=".openquantum/distributions/${{ matrix.target }}/artifacts"
          cd "$oq_artifacts"
          if command -v shasum >/dev/null; then shasum -a 256 -c SHA256SUMS; else sha256sum -c SHA256SUMS; fi
          mkdir -p ../verified-content
          tar -xzf OpenQuantum-*-DSH-*.tar.gz -C ../verified-content
      - name: Verify installed dependencies, configuration retention and runtimes
        shell: bash
        run: npm run desktop:package:smoke -- ".openquantum/distributions/${{ matrix.target }}/verified-content"
      - name: Upload verified capability archive
        uses: actions/upload-artifact@v7
        with:
          name: OpenQuantum-test-${{ matrix.target }}
          path: |
            .openquantum/distributions/${{ matrix.target }}/artifacts/*.tar.gz
            .openquantum/distributions/${{ matrix.target }}/artifacts/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenQuantum-installer-checks-${{ matrix.target }}
          path: .openquantum/distributions/${{ matrix.target }}/validation
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
