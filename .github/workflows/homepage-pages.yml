name: Product homepage

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/*homepage*"
      - "tests/homepage.test.mjs"
      - "packages/openquantum-web-branding/assets/**"
      - "public/openquantum/fonts/**"
      - "experiments/qutip-rust-wigner/**"
      - "experiments/pennylane-rust-commutator/**"
      - ".github/workflows/homepage-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/*homepage*"
      - "tests/homepage.test.mjs"
      - "packages/openquantum-web-branding/assets/**"
      - "public/openquantum/fonts/**"
      - "experiments/qutip-rust-wigner/**"
      - "experiments/pennylane-rust-commutator/**"
      - ".github/workflows/homepage-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Homepage build and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Build and verify static homepage
        run: node --test tests/homepage.test.mjs

      - name: Upload static homepage only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/homepage

  deploy:
    name: Publish homepage
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy static homepage
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
