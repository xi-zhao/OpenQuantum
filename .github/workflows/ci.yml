name: CI

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check workflow definitions
        shell: bash
        run: |
          actionlint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$actionlint_dir"
          curl --fail --location --retry 3 --output "$actionlint_dir/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$actionlint_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -color -shellcheck= -pyflakes=

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Check the prepared tropidist CLI on Linux
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENQUANTUM_LIVE_TROPIDIST: '1'
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- .agents/skills/tropidist-distance .agents/sdk-libraries.json \
            src/lib/sdk-{source,source-record,access}.mjs src/lib/{sdk_bootstrap.py,tropidist-build.mjs} \
            scripts/setup-sdk.mjs tests/tropidist-*.test.mjs .github/workflows/ci.yml; then exit 0; fi
          python3 -m venv "$RUNNER_TEMP/tropidist-tools"
          "$RUNNER_TEMP/tropidist-tools/bin/pip" install uv==0.11.1
          export PATH="$RUNNER_TEMP/tropidist-tools/bin:$PATH"
          node scripts/setup-sdk.mjs tropidist-distance
          node --test tests/tropidist-cli.test.mjs

  desktop-source-install:
    name: Desktop source install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build the pinned Desktop source
        run: npm run desktop:setup

      - name: Verify Desktop source install
        run: npm run desktop:verify-install

  container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and boot the production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag openquantum-ci .
          docker run --detach \
            --name openquantum-ci \
            --network host \
            openquantum-ci
          cleanup() {
            docker logs openquantum-ci 2>&1 | \
              sed -E 's/([?&]token=)[A-Za-z0-9_-]+/\1[redacted]/g' || true
            docker rm --force openquantum-ci || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            # HTTP health confirms the listener, not the 0.2 loader's startup audit.
            # Wait for its authenticated URL too; never print the token here.
            if [ "$(docker inspect --format '{{.State.Health.Status}}' openquantum-ci)" = "healthy" ] &&
              docker logs openquantum-ci 2>&1 | grep -E 'https?://[^[:space:]]+/\?token=[A-Za-z0-9_-]+' > /dev/null; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' openquantum-ci)" != "true" ]; then
              echo "OpenQuantum container exited before becoming ready" >&2
              exit 1
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "OpenQuantum container did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          docker logs openquantum-ci 2>&1 | docker exec --interactive openquantum-ci \
            node scripts/probe-harness-host.mjs http://127.0.0.1:3000
