name: CI

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check workflow definitions
        shell: bash
        run: |
          actionlint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$actionlint_dir"
          curl --fail --location --retry 3 --output "$actionlint_dir/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$actionlint_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -color -shellcheck= -pyflakes=

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for the keynote renderer
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare and verify Chromium for offline browser and render tests
        shell: bash
        run: |
          python -m pip install --only-binary=:all: -r tests/helpers/keynote-requirements.txt
          find_chromium() {
            node --input-type=module -e 'import { localChromium } from "./tests/helpers/chromium.mjs"; process.stdout.write(await localChromium() ?? "");'
          }
          chrome=$(find_chromium)
          if [[ -z "$chrome" ]]; then
            python -m playwright install --with-deps chromium
            chrome=$(find_chromium)
          fi
          if [[ ! -x "$chrome" ]]; then
            echo "Required Chromium executable unavailable after provisioning" >&2
            exit 1
          fi
          "$chrome" --version
          echo "OPENQUANTUM_CHROMIUM=$chrome" >> "$GITHUB_ENV"
          if [[ -z "$(fc-list :lang=zh-cn family)" ]]; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi

      - name: Run quality gate
        env:
          OPENQUANTUM_REQUIRE_BROWSER_TESTS: "1"
          OPENQUANTUM_REQUIRE_KEYNOTE_RENDER: "1"
        run: npm run check

  keynote-reference:
    name: Keynote reference pixels (macOS)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare the pinned macOS renderer
        env:
          CHROME_VERSION: '149.0.7827.55'
        run: |
          python -m pip install --only-binary=:all: -r tests/helpers/keynote-requirements.txt
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/chrome.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip"
          ditto -x -k "$RUNNER_TEMP/chrome.zip" "$RUNNER_TEMP/keynote-chrome"
          app="$RUNNER_TEMP/keynote-chrome/chrome-mac-arm64/Google Chrome for Testing.app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$CHROME_VERSION" ]]
          chrome="$app/Contents/MacOS/Google Chrome for Testing"
          test -x "$chrome"
          echo "OPENQUANTUM_CHROMIUM=$chrome" >> "$GITHUB_ENV"
      - name: Reproduce the four published benchmark plates
        env:
          OPENQUANTUM_REQUIRE_KEYNOTE_PIXEL_MATCH: "1"
        run: node --test tests/readme-keynote.test.mjs

  desktop-source-install:
    name: Desktop source install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build the pinned Desktop source
        run: npm run desktop:setup

      - name: Verify Desktop source install
        run: npm run desktop:verify-install

  container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and boot the production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag openquantum-ci .
          docker run --detach \
            --name openquantum-ci \
            --network host \
            openquantum-ci
          cleanup() {
            docker logs openquantum-ci 2>&1 | \
              sed -E 's/([?&]token=)[A-Za-z0-9_-]+/\1[redacted]/g' || true
            docker rm --force openquantum-ci || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            # HTTP health confirms the listener, not the 0.2 loader's startup audit.
            # Wait for its authenticated URL too; never print the token here.
            if [ "$(docker inspect --format '{{.State.Health.Status}}' openquantum-ci)" = "healthy" ] &&
              docker logs openquantum-ci 2>&1 | grep -E 'https?://[^[:space:]]+/\?token=[A-Za-z0-9_-]+' > /dev/null; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' openquantum-ci)" != "true" ]; then
              echo "OpenQuantum container exited before becoming ready" >&2
              exit 1
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "OpenQuantum container did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          docker logs openquantum-ci 2>&1 | docker exec --interactive openquantum-ci \
            node scripts/probe-harness-host.mjs http://127.0.0.1:3000
