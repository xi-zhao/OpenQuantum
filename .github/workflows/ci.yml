name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

  desktop-source-install:
    name: Desktop source install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build the pinned Desktop source
        run: npm run desktop:setup

      - name: Verify Desktop source install
        run: npm run desktop:verify-install

  container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and boot the production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag openquantum-ci .
          docker run --detach \
            --name openquantum-ci \
            --network host \
            openquantum-ci
          cleanup() {
            docker logs openquantum-ci 2>&1 | \
              sed -E 's/([?&]token=)[A-Za-z0-9_-]+/\1[redacted]/g' || true
            docker rm --force openquantum-ci || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' openquantum-ci)" = "healthy" ]; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' openquantum-ci)" != "true" ]; then
              echo "OpenQuantum container exited before becoming ready" >&2
              exit 1
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "OpenQuantum container did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          docker logs openquantum-ci 2>&1 | docker exec --interactive openquantum-ci \
            node scripts/probe-harness-host.mjs http://127.0.0.1:3000
