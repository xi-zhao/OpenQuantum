name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated agent rules
        shell: bash
        run: |
          bash scripts/sync-agent-rules.sh
          git diff --exit-code -- \
            .amazonq/rules/project.md \
            .clinerules \
            .continue/rules/project.md \
            .github/copilot-instructions.md

      - name: Run quality gate
        run: npm run check
