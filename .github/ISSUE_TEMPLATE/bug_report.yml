name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run `npm run dev:stack`
        2. Create or open a session
        3. Perform the smallest action that exposes the problem
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or screenshots if possible.
    validations:
      required: true

  - type: input
    id: capability-release
    attributes:
      label: Capability release
      description: Publisher, capability, version and package digest when applicable.
      placeholder: io.github.example/ground-state@1.0.0 (sha256:...)

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node -v` to find this.
      placeholder: v24.x.x
    validations:
      required: true

  - type: input
    id: harness-version
    attributes:
      label: Harness / OpenQuantum version
      description: Include commit hash and DeepSeek Harness version when known.
      placeholder: OpenQuantum commit / dsh 0.1.0-rc.6

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots.
