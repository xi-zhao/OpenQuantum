# Community multi-provider hardware control plane. It is intentionally kept
# disabled: the server exposes real job submission/cancellation tools and its
# upstream Python dependency ranges are not a reproducible release. The setup
# command checks out one reviewed commit into the ignored .openquantum tree;
# Harness still owns MCP lifecycle and credential injection.
- id: mcp-quantum-hardware
  name: ./credentialed-mcp-client.mjs
  disabled: true
  config:
    serverName: quantum_hardware
    transport: stdio
    command: uv
    args:
      - run
      - --with-requirements
      - !!js process.cwd() + '/.openquantum/external/quantum-hardware-mcp/requirements.txt'
      - python
      - !!js process.cwd() + '/.openquantum/external/quantum-hardware-mcp/server.py'
    env:
      IBM_SHOW_ACCOUNT_INFO: 'false'
    credentialEnv:
      IBM_QUANTUM_TOKEN: QISKIT_IBM_TOKEN
    optionalCredentialEnv:
      IONQ_API_KEY: IONQ_API_KEY
    cwd: !!js process.cwd() + '/.openquantum/external/quantum-hardware-mcp'
    toolCallTimeoutMs: 600000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 2000
      maxDelayMs: 60000
      maxAttempts: 5

# Origin Quantum (OriginQ) official runtime MCP. Like the community hardware
# control plane it stays disabled by default: sample/estimate/batch tools submit
# real jobs to the Origin Quantum cloud (Wukong QPU) and consume credits. The
# setup command checks out one reviewed commit into the ignored .openquantum
# tree; uv builds the pinned pyproject environment (pyqpanda3 is a native wheel)
# on the first tool call. The QPANDA3_API_KEY credential is resolved from the
# Harness store by the trusted adapter, never from UI state or Cordis YAML.
- id: mcp-qpanda-runtime
  name: ./credentialed-mcp-client.mjs
  disabled: true
  config:
    serverName: qpanda_runtime
    transport: stdio
    command: uv
    args:
      - run
      - --project
      - !!js process.cwd() + '/.openquantum/external/qpanda3-runtime-mcp'
      - python
      - -m
      - qpanda3_runtime_mcp_server
    env: {}
    credentialEnv:
      QPANDA3_API_KEY: QPANDA3_API_KEY
    cwd: !!js process.cwd() + '/.openquantum/external/qpanda3-runtime-mcp'
    toolCallTimeoutMs: 600000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 2000
      maxDelayMs: 60000
      maxAttempts: 5

# Preserve one bounded scientific presentation in Harness-native tool/result
# content. The plugin owns no runtime or storage; it only adapts MCP
# structuredContent at the official tools/post-execute seam.
- id: scientific-result-projection
  name: ./scientific-result-projection.mjs

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
