# OpenQuantum agent-plane composition. Domain behavior lives in project
# Skills/MCP; this preset only gives them a safe execution surface.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are OpenQuantum, a scientific research agent powered by {{model}}.
      Your working directory is {{cwd}}. Load the relevant project Skill before
      performing domain work, preserve scientific uncertainty, and never claim
      scientific acceptance unless a trusted Acceptance Report or Result Commit
      records status=passed for the relevant materialized evidence.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: openquantum-capabilities
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.cwd() + '/.agents/skills'

# Agent Presets mounts this composition once per process and every joined
# Session inherits the same Harness MCP Client. Restart Harness after editing this
# composition: retained hot-reload generations must not own the same
# serverName concurrently.
- id: mcp-openquantum-quantum
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: openquantum_quantum
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/.agents/skills/quantum-ground-state/mcp/server.mjs'
    env: {}
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 60000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 30000
      maxAttempts: 10

# FieldQKit is a Python SDK rather than a native MCP Server. This thin trusted
# bridge exposes only credential status and read-only backend discovery. The
# pinned package is materialized lazily by uv on the first discovery request;
# no QPU job submission tool is registered in this milestone.
- id: mcp-fieldqkit
  name: ./credentialed-mcp-client.mjs
  config:
    serverName: fieldqkit
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/.agents/skills/fieldqkit-hardware/mcp/server.mjs'
    env: {}
    optionalCredentialEnv:
      QUAFU_API_TOKEN: QUAFU_API_TOKEN
      TIANYAN_API_TOKEN: TIANYAN_API_TOKEN
      GUODUN_API_TOKEN: GUODUN_API_TOKEN
      TENCENT_API_TOKEN: TENCENT_API_TOKEN
      ORIGIN_API_TOKEN: ORIGIN_API_TOKEN
      FIELDQUANTUM_API_TOKEN: FIELDQUANTUM_API_TOKEN
      LOGICALQUBIT_API_TOKEN: LOGICALQUBIT_API_TOKEN
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 180000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 30000
      maxAttempts: 10

# Pinned toqito density-matrix facts plus an independent JavaScript Validator.
# The MCP process starts cheaply and uv materializes the Python environment only
# on first use. It exposes no cloud credentials, remote service or hardware job.
- id: mcp-quantum-information-audit
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: toqito_audit
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/.agents/skills/quantum-information-audit/mcp/server.mjs'
    env: {}
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 180000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 30000
      maxAttempts: 10

# Pinned MQT QCEC unitary-circuit equivalence checking. The MCP process starts
# cheaply and uv materializes the native wheel only on first use. Inputs are
# bounded OpenQASM 2 strings; no arbitrary paths, cloud or hardware are exposed.
- id: mcp-quantum-circuit-verification
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: qcec_local
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/.agents/skills/quantum-circuit-verification/mcp/server.mjs'
    env: {}
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 30000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 30000
      maxAttempts: 10

# Pinned Stim and PyMatching rotated-surface-code memory experiments. Inputs are
# explicitly bounded and seeded; results are finite-shot observations with
# uncertainty, not threshold or hardware claims. No cloud credentials or QPU
# submission Tool is registered.
- id: mcp-qec-memory-experiment
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: qec_local
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/.agents/skills/qec-memory-experiment/mcp/server.mjs'
    env: {}
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 60000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 30000
      maxAttempts: 10

# TyxonQ is a Python SDK rather than a stable upstream MCP server. This local
# bridge exposes only bounded circuit and noise simulation. It is disabled by
# default because the pinned scientific Python environment is large and is
# materialized lazily by uv on the first tool call. No cloud token or hardware
# submission Tool is registered.
- id: mcp-tyxonq-local
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: true
  config:
    serverName: tyxonq_local
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/.agents/skills/tyxonq-workbench/mcp/server.mjs'
    env: {}
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 180000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 30000
      maxAttempts: 10

# QMClaw experiment catalog and tune-up workflow are exposed through a bounded
# OpenQuantum simulator rather than the upstream Agentic Workflow runtime. All
# 13 experiment families use explicit SI units and synthetic, seeded data; no
# LabRAD/lqms process, credential, parameter write or real instrument is opened.
- id: mcp-qmclaw-local
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: qmclaw_local
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/.agents/skills/qmclaw-workbench/mcp/server.mjs'
    env: {}
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 30000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 30000
      maxAttempts: 10

# Local pyqpanda_alg QUBO modeling and solving bridge. The MCP process starts
# cheaply; its pinned scientific Python environment (pyqpanda3 is a native
# wheel) is materialized lazily by uv on the first tool call. It only compiles
# and solves bounded QUBO problems on the CPU simulator and registers no Origin
# Quantum cloud token or hardware submission Tool.
- id: mcp-qpanda-qubo
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: qpanda_qubo
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js process.cwd() + '/.agents/skills/qpanda-qubo/mcp/server.mjs'
    env: {}
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 300000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 30000
      maxAttempts: 10

# Official Qiskit MCP servers. Package versions are pinned so every Fork gets
# the same tool schemas. Set OPENQUANTUM_DISABLE_QISKIT_MCP=1 for offline CI;
# normal installations enable the two credential-free core services.
- id: mcp-qiskit
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: !!js process.env.OPENQUANTUM_DISABLE_QISKIT_MCP === '1'
  config:
    serverName: qiskit
    transport: stdio
    command: uvx
    args:
      - --from
      - qiskit-mcp-server==0.3.1
      - qiskit-mcp-server
    env: {}
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 120000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 30000
      maxAttempts: 10

- id: mcp-qiskit-docs
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: !!js process.env.OPENQUANTUM_DISABLE_QISKIT_MCP === '1'
  config:
    serverName: qiskit_docs
    transport: stdio
    command: uvx
    args:
      - --from
      - qiskit-docs-mcp-server==0.3.0
      - --with
      - socksio==1.0.0
      - qiskit-docs-mcp-server
    env: {}
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 120000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 30000
      maxAttempts: 10

# Cloud services stay opt-in. Their shared IBM token is resolved from the
# Harness credential store by a thin trusted adapter, never from UI state or
# Cordis YAML. Enabling either service requires a Harness restart.
- id: mcp-qiskit-ibm-runtime
  name: ./credentialed-mcp-client.mjs
  disabled: true
  config:
    serverName: qiskit_ibm_runtime
    transport: stdio
    command: uvx
    args:
      - --from
      - qiskit-ibm-runtime-mcp-server==0.6.1
      - qiskit-ibm-runtime-mcp-server
    env: {}
    credentialEnv:
      QISKIT_IBM_TOKEN: QISKIT_IBM_TOKEN
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 300000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 1000
      maxDelayMs: 60000
      maxAttempts: 10

- id: mcp-qiskit-ibm-transpiler
