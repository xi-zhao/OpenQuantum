# OpenQuantum deployment composition for DeepSeek Harness.
# Secrets stay behind apiKeyEnv references and are resolved per request.

- id: agent-default-model
  config:
    provider: openquantum-public
    model: kimi-k2.7-code

# Product sessions default to the deployment-owned OpenQuantum composition.
- id: agent-presets
  config:
    default: openquantum

# This deployment exposes only routes explicitly owned by OpenQuantum.
- id: llm-deepseek
  disabled: true

# Presets own their Skill sources. Disabling the host provider prevents personal
# ~/.dsh and ~/.agents skills from leaking into product sessions.
- id: skill-filesystem
  disabled: true

# Keep the official DeepSeek Harness Web shell and replace only product
# identity through its supported index-transform seam. OpenQuantum does not
# carry a fork of the Harness React frontend.
- insert:
    - id: openquantum-web-branding
      name: '@openquantum/harness-web-branding'
      inject: [webServer]
    - id: openquantum-web-capabilities
      name: '@openquantum/harness-web-capabilities'
      inject: [webServer, credentials]

- id: llm-pi-ai
  config:
    providers:
      openquantum-public:
        displayName: OpenQuantum Public Gateway
        apiKeyEnv: OPENQUANTUM_PUBLIC_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENQUANTUM_PUBLIC_BASE_URL || 'https://api.example.invalid/v1'
        defaultContextWindow: 131072
        defaultMaxTokens: 8192
        defaultInput:
          - text
        streamIdleTimeoutMs: 300000
        models:
          - id: kimi-k2.7-code
            name: Kimi K2.7 Code
          - id: glm5.2
            name: GLM 5.2
      openquantum-private:
        displayName: OpenQuantum Private Gateway
        apiKeyEnv: OPENQUANTUM_PRIVATE_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENQUANTUM_PRIVATE_BASE_URL || 'https://private-api.example.invalid/v1'
        defaultContextWindow: 131072
        defaultMaxTokens: 8192
        defaultInput:
          - text
        streamIdleTimeoutMs: 300000
        models:
          - id: kimi2.7
            name: Kimi 2.7
