# OpenQuantum deployment composition for DeepSeek Harness.
# Secrets stay behind apiKeyEnv references and are resolved per request.
# Model routes and the default model/preset live in the OpenQuantum profile
# bundle below each profile's native settings layer, so Settings stays editable.

# This deployment exposes only routes explicitly owned by OpenQuantum.
- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

# Keep the distribution's existing local-data policy across upstream defaults.
- id: session-log-deepseek
  config:
    enabled: false

- id: product-analytics
  disabled: true

- id: desktop-product-telemetry
  disabled: true

# Presets own their Skill sources. Disabling the host provider prevents personal
# ~/.dsh and ~/.agents skills from leaking into product sessions.
- id: skill-filesystem
  disabled: true

# Keep the official DeepSeek Harness Web shell and replace only product
# identity through its index transform and native brand slots. OpenQuantum does not
# carry a fork of the Harness React frontend.
- insert:
    # DSH 0.2 registers explicit preset declarations instead of scanning folders.
    # The declaration file lives in the profiles tree so official packages
    # resolve from the active Host dependency graph.
    - id: openquantum-presets
      name: '@deepseek-ai/cordis-plugin-include'
      config:
        path: ../.agent-presets/presets.cordis.yml
    - id: openquantum-web-locales
      name: '@openquantum/harness-web-locales'
      inject: [webServer]
    - id: openquantum-web-branding
      name: '@openquantum/harness-web-branding'
      inject: [webServer]
    - id: openquantum-web-capabilities
      name: '@openquantum/harness-web-capabilities'
      inject: [webServer, credentials, skills, tools, llm]
    - id: openquantum-web-learning
      name: '@openquantum/harness-web-learning'
      inject: [webServer, llm, agentDefaultModel, attachments]
    - id: openquantum-web-updates
      name: '@openquantum/harness-web-updates'
      inject: [webServer]
