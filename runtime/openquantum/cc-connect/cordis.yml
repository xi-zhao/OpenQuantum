# Applied by dsh --profile acp --patch <this file>. The official base and ACP
# bundles own Agent lifecycle, persistence, permissions and JSON-RPC stdio.
# This overlay contributes OpenQuantum identity, routes and additional Tools.

- id: credentials
  config:
    dshHome: !!js process.env.DSH_HOME || process.cwd() + '/.openquantum/dsh'

- id: settings
  config:
    dshHome: !!js process.env.DSH_HOME || process.cwd() + '/.openquantum/dsh'

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: acp
  inject: [acpAppStartup, openquantumAcpModelReady]
  config:
    provider: openquantum-public
    model: kimi-k2.7-code

- id: agent-default-model
  config:
    provider: openquantum-public
    model: kimi-k2.7-code

- id: system-prompt
  config:
    personaPrefix: >-
      You are OpenQuantum, a scientific research agent powered by {{model}}.
      Your working directory is {{cwd}}. Load the relevant project Skill before
      performing domain work, preserve scientific uncertainty, and never claim
      scientific acceptance unless a trusted Acceptance Report or Result Commit
      records status=passed for the relevant materialized evidence.
    personaSuffix: ''

- id: session-persistence-jsonl
  config:
    root: !!js process.env.OPENQUANTUM_CC_CONNECT_SESSIONS_ROOT || process.cwd() + '/.openquantum/cc-connect/sessions'

- id: skill-filesystem
  disabled: false
  config:
    providerName: openquantum-capabilities
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.cwd() + '/.agents/skills'

# The shared home can carry Web/Desktop rows; stdio mounts no browser host.
- id: openquantum-web-branding
  disabled: true
- id: openquantum-web-capabilities
  disabled: true
- id: openquantum-web-learning
  disabled: true

# Reuse the route catalog even when this home has never launched Web.
- id: openquantum-model-routes
  disabled: true

- insert:
    - id: openquantum-acp-ready
      name: ./ready.mjs
      config:
        provider: openquantum-public

    - id: openquantum-acp-model-routes
      name: '@deepseek-ai/cordis-plugin-include'
      config:
        path: ../model-routes.cordis.yml

    # Generic rows already belong to dsh-base. Mount only the additional
    # native Tools, MCP Clients and scientific result hook from this preset.
    - id: openquantum-agent-extensions
      name: '@deepseek-ai/cordis-plugin-include'
      config:
        path: ../../.agent-presets/openquantum/agent.cordis.yml
        patches:
          - id: persona
            disabled: true
          - id: agent-instructions
            disabled: true
          - id: tool-bash
            disabled: true
          - id: tool-pwsh
            disabled: true
          - id: tool-fs
            disabled: true
          - id: tool-fs-search
            disabled: true
          - id: tool-jobs
            disabled: true
          - id: skill-filesystem
            disabled: true
          - id: tool-skill
            disabled: true
          - id: tool-goal
            disabled: true
          - id: tool-ask-user
            disabled: true
          - id: tool-web
            disabled: true
          - id: tool-todo
            disabled: true
          - id: compaction
            disabled: true
