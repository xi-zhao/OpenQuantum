# OpenQuantum owns the default product surface over the pinned DSH runtime.
# Upstream feature upgrades are reviewed explicitly, never installed from its UI.
- insert:
    - id: openquantum-capability-host
      name: '@openquantum/harness-capability-host'
      inject: [credentials, webServer, connection]
    - id: openquantum-desktop-branding
      name: '@openquantum/harness-web-branding/desktop'
      inject: [desktopRuntime]

- id: desktop-shell
  inject: [openquantumDesktopIcon]

- id: openquantum-web-branding
  config:
    minimalUi: true

- id: openquantum-web-capabilities
  config:
    channels: false
    adaptive: true

# Keep the personal workspace focused on conversations and files.
- id: desktop-updates
  disabled: true

- id: desktop-profiles
  disabled: true

- id: desktop-diagnostics
  disabled: true

- id: openquantum-web-learning
  disabled: true
