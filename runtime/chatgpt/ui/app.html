<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CREDENTIAL_ORIGIN -->
  <title>OpenQuantum · 设置</title>
  <style>/* APP_STYLES */</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand"><span class="brand-mark"><img class="mark-light" src="__OQ_MARK__" alt="" width="36" height="36"><img class="mark-dark" src="__OQ_MARK_INVERSE__" alt="" width="36" height="36"></span><strong>OpenQuantum</strong></div>
      <a id="github-link" class="github-link" href="https://github.com/xi-zhao/OpenQuantum" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看 OpenQuantum">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    <div class="navigation">
      <nav aria-label="主导航" role="tablist"><!-- COMPONENT_TABS --></nav>
    </div>
    <section class="intro">
      <h1 id="page-title">OpenQuantum</h1>
      <p id="page-description" hidden></p>
      <p id="settings-scope" hidden></p>
    </section>
    <section id="toolbar" aria-label="搜索与筛选" hidden>
      <label class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="搜索名称或用途" aria-label="搜索 Skills" autocomplete="off">
      </label>
      <div class="filter-fields">
        <label>用途<select id="category" aria-label="按用途筛选"><option value="all">全部用途</option></select></label>
        <label>状态<select id="state" aria-label="按状态筛选"><option value="all">全部状态</option></select></label>
      </div>
      <div class="filter-summary">
        <span id="count" role="status" aria-live="polite" aria-atomic="true"></span>
        <button id="clear-filters" class="quiet" hidden>清除筛选</button>
      </div>
    </section>
    <div id="notice" role="status" aria-live="polite" aria-atomic="true">正在读取设置…</div>
    <main id="content" role="tabpanel" aria-labelledby="tab-runtime" aria-busy="true">
      <div class="loading-placeholder" aria-hidden="true"><span></span><span></span><span></span></div>
    </main>
    <footer><span>共建可信的量子科研智能。</span><button id="refresh" class="quiet" hidden>刷新状态</button><span class="version">__RELEASE_VERSION__</span></footer>
  </div>
  <script type="module">/* APP_SCRIPT */</script>
</body>
</html>
