<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CREDENTIAL_ORIGIN -->
  <title>OpenQuantum · 设置</title>
  <style>/* APP_STYLES */</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand"><span class="brand-mark"><img class="mark-light" src="__OQ_MARK__" alt="" width="36" height="36"><img class="mark-dark" src="__OQ_MARK_INVERSE__" alt="" width="36" height="36"></span><strong>OpenQuantum</strong></div>
      <a id="github-link" class="github-link" href="https://github.com/xi-zhao/OpenQuantum" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看 OpenQuantum">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    <div class="navigation">
      <nav aria-label="主导航" role="tablist"><!-- COMPONENT_TABS --></nav>
    </div>
    <section class="intro">
      <h1 id="page-title">OpenQuantum</h1>
      <p id="page-description" hidden></p>
      <p id="settings-scope" hidden></p>
    </section>
    <section id="toolbar" hidden>
      <input id="search" type="search" placeholder="搜索名称或用途" aria-label="搜索 Skills">
      <details id="filters"><summary>筛选</summary><div class="filter-fields">
        <label>用途<select id="category" aria-label="按用途筛选"><option value="all">全部用途</option></select></label>
        <label>状态<select id="state" aria-label="按状态筛选"><option value="all">全部状态</option></select></label>
      </div></details>
      <button id="clear-filters" class="quiet" hidden>清除搜索与筛选</button>
      <span id="count" role="status" aria-live="polite"></span>
    </section>
    <div id="notice" role="status" aria-live="polite">正在连接插件…</div>
    <main id="content" role="tabpanel" aria-labelledby="tab-runtime"></main>
    <footer><span>让量子想法运行起来。</span><button id="refresh" class="quiet" hidden>刷新状态</button><span class="version">__RELEASE_VERSION__</span></footer>
  </div>
  <script type="module">/* APP_SCRIPT */</script>
</body>
</html>
