[project]
name = "openquantum-algorithm-examples"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "qiskit==2.5.2"]

[dependency-groups]
gradients = ["qiskit-algorithms==0.4.0"]
pennylane = ["pennylane==0.45.1"]
tensor = ["quimb==1.15.0"]
chemistry = [{include-group = "tensor"}, "pyscf==2.14.0"]

[tool.uv]
package = false
# Preserve the original full installation when no group is selected.
default-groups = ["gradients", "pennylane", "chemistry"]
