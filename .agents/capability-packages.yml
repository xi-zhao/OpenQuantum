schemaVersion: "1.1"

packages:
  - id: quantum-sdk-advisor
    level: L0

  - id: qiskit-circuit-workbench
    level: L1
    execution:
      mcpServers:
        - name: qiskit
          source: external
          activation: conditional
          contractCheck: scripts/probe-qiskit-mcp.mjs
          effectEvidence: reviewed-source
          effectEvidenceRef: docs/integrations/QISKIT_MCP_EFFECT_REVIEW.md
          tools:
            - name: load_circuit_from_qasm_tool
              effect: read-only
            - name: analyze_circuit_tool
              effect: read-only
            - name: compare_optimization_levels_tool
              effect: read-only
            - name: transpile_circuit_tool
              effect: read-only
            - name: convert_qpy_to_qasm3_tool
              effect: read-only
            - name: convert_qasm3_to_qpy_tool
              effect: read-only
            - name: export_circuit_to_qasm_tool
              effect: read-only
        - name: qiskit_docs
          source: external
          activation: conditional
          contractCheck: scripts/probe-qiskit-mcp.mjs
          effectEvidence: reviewed-source
          effectEvidenceRef: docs/integrations/QISKIT_MCP_EFFECT_REVIEW.md
          tools:
            - name: search_docs_tool
              effect: read-only
            - name: get_page_tool
              effect: read-only
            - name: lookup_error_code_tool
              effect: read-only
      nativeTools: []
      checks:
        - tests/project-settings.test.mjs
        - tests/harness-native-quantum.test.mjs

  - id: fieldqkit-hardware
    level: L1
    execution:
      mcpServers:
        - name: fieldqkit
          source: package
          entrypoint: .agents/skills/fieldqkit-hardware/mcp/server.mjs
          activation: always
          contractCheck: .agents/skills/fieldqkit-hardware/test/mcp.test.mjs
          effectEvidence: mcp-annotations
          tools:
            - name: inspect_fieldqkit_setup
              effect: read-only
            - name: discover_fieldqkit_backends
              effect: workspace-write
      nativeTools: []
      checks:
        - .agents/skills/fieldqkit-hardware/test/mcp.test.mjs

  - id: qpanda-qubo
    level: L1
    execution:
      mcpServers:
        - name: qpanda_qubo
          source: package
          entrypoint: .agents/skills/qpanda-qubo/mcp/server.mjs
          activation: always
          contractCheck: .agents/skills/qpanda-qubo/test/mcp.test.mjs
          effectEvidence: mcp-annotations
          tools:
            - name: inspect_qpanda_qubo_runtime
              effect: workspace-write
            - name: solve_qpanda_qubo
              effect: workspace-write
            - name: model_and_solve_qpanda_qubo
              effect: workspace-write
      nativeTools: []
      checks:
        - .agents/skills/qpanda-qubo/test/mcp.test.mjs

  - id: quantum-circuit-verification
    level: L1
    execution:
      mcpServers:
        - name: qcec_local
          source: package
          entrypoint: .agents/skills/quantum-circuit-verification/mcp/server.mjs
          activation: always
          contractCheck: .agents/skills/quantum-circuit-verification/test/mcp.test.mjs
          effectEvidence: mcp-annotations
          tools:
            - name: inspect_qcec_runtime
              effect: workspace-write
            - name: verify_circuit_equivalence
              effect: workspace-write
      nativeTools: []
      checks:
        - .agents/skills/quantum-circuit-verification/test/mcp.test.mjs

  - id: qec-memory-experiment
    level: L1
    execution:
      mcpServers:
        - name: qec_local
          source: package
          entrypoint: .agents/skills/qec-memory-experiment/mcp/server.mjs
          activation: always
          contractCheck: .agents/skills/qec-memory-experiment/test/mcp.test.mjs
          effectEvidence: mcp-annotations
          tools:
            - name: inspect_qec_runtime
              effect: workspace-write
            - name: run_qec_memory_experiment
              effect: workspace-write
      nativeTools: []
      checks:
        - .agents/skills/qec-memory-experiment/test/mcp.test.mjs

  - id: tyxonq-workbench
    level: L1
    execution:
      mcpServers:
        - name: tyxonq_local
          source: package
          entrypoint: .agents/skills/tyxonq-workbench/mcp/server.mjs
          activation: opt-in
          contractCheck: .agents/skills/tyxonq-workbench/test/mcp.test.mjs
          effectEvidence: mcp-annotations
          tools:
            - name: inspect_tyxonq_runtime
              effect: workspace-write
            - name: simulate_tyxonq_circuit
              effect: workspace-write
      nativeTools: []
      checks:
        - .agents/skills/tyxonq-workbench/test/mcp.test.mjs

  - id: qmclaw-workbench
    level: L1
    execution:
      mcpServers: []
      nativeTools:
        - name: list_qmclaw_experiments
          providerPlugin: ./native-quantum-tools.mjs
          activation: always
          contractCheck: .agents/skills/qmclaw-workbench/test/tool-provider.test.mjs
          effect: read-only
          effectEvidence: conservative-provider
        - name: simulate_qmclaw_experiment
          providerPlugin: ./native-quantum-tools.mjs
          activation: always
          contractCheck: .agents/skills/qmclaw-workbench/test/tool-provider.test.mjs
          effect: read-only
          effectEvidence: conservative-provider
      checks:
        - .agents/skills/qmclaw-workbench/test/tool-provider.test.mjs
        - tests/native-quantum-tools.test.mjs

  - id: platform-diagnostics
    level: L2
    execution:
      mcpServers: []
      nativeTools:
        - name: bash
          providerPlugin: "@deepseek-ai/dsh-tool-bash"
          activation: conditional
          contractCheck: tests/harness-native-quantum.test.mjs
          effect: external-write
          effectEvidence: conservative-provider
        - name: pwsh
          providerPlugin: "@deepseek-ai/dsh-tool-pwsh"
          activation: conditional
          contractCheck: tests/harness-native-quantum.test.mjs
          effect: external-write
          effectEvidence: conservative-provider
      checks:
        - .agents/skills/platform-diagnostics/evals/run-evals.mjs
    audit:
      manifest: capability.yaml

  - id: quantum-information-audit
    level: L3
    execution:
      mcpServers:
        - name: toqito_audit
          source: package
          entrypoint: .agents/skills/quantum-information-audit/mcp/server.mjs
          activation: always
          contractCheck: .agents/skills/quantum-information-audit/test/mcp.test.mjs
          effectEvidence: mcp-annotations
          tools:
            - name: inspect_toqito_runtime
              effect: workspace-write
            - name: audit_density_matrix
              effect: workspace-write
      nativeTools: []
      checks:
        - .agents/skills/quantum-information-audit/test/mcp.test.mjs
        - .agents/skills/quantum-information-audit/evals/run-evals.mjs
    audit:
      manifest: capability.yaml
    materialization:
      adapter: runtime/openquantum/agent-presets/openquantum/scientific-result-projection.mjs
      checks:
        - tests/quantum-information-materialization.test.mjs
        - tests/scientific-result-projection.test.mjs

  - id: quantum-ground-state
    level: L3
    execution:
      mcpServers: []
      nativeTools:
        - name: solve_and_validate_ground_state
          providerPlugin: ./native-quantum-tools.mjs
          activation: always
          contractCheck: tests/native-quantum-tools.test.mjs
          effect: read-only
          effectEvidence: conservative-provider
      checks:
        - tests/native-quantum-tools.test.mjs
        - .agents/skills/quantum-ground-state/evals/run-evals.mjs
    audit:
      manifest: capability.yaml
    materialization:
      adapter: runtime/openquantum/agent-presets/openquantum/scientific-result-projection.mjs
      checks:
        - tests/scientific-result-materialization.test.mjs
        - tests/scientific-result-projection.test.mjs
