  - id: platform-diagnostics
    level: L2
    execution:
      mcpServers: []
      nativeTools:
        - name: bash
          providerPlugin: "@deepseek-ai/dsh-tool-bash"
          activation: conditional
          contractCheck: tests/harness-native-quantum.test.mjs
          effect: external-write
          effectEvidence: conservative-provider
        - name: pwsh
          providerPlugin: "@deepseek-ai/dsh-tool-pwsh"
          activation: conditional
          contractCheck: tests/harness-native-quantum.test.mjs
          effect: external-write
          effectEvidence: conservative-provider
      checks:
        - .agents/skills/platform-diagnostics/evals/run-evals.mjs
    audit:
      manifest: capability.yaml

  - id: quantum-information-audit
