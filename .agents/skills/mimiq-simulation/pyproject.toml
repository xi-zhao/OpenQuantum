[project]
name = "openquantum-mimiq-simulation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mimiq-exaqt==0.3.0", "mimiqcircuits==0.28.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]
