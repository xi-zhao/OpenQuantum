schemaVersion: "1.1"
id: hamiltonian-simulation
version: 1.1.0
displayName: Hamiltonian product-formula observations
description: Independent matrix, resource and sampling checks with materialized, replayable central Acceptance.
maturity:
  status: draft
  evidence:
    - id: local-observations-2026-11-25
      kind: eval-report
      path: evals/evidence-phase5.json
      sha256: e670be7edac5ba9aef6f964e174d4dfe2291aab8034e539d2ed7af07f02ace67
skill:
  name: hamiltonian-simulation
  entrypoint: SKILL.md
scope:
  supportedClaims:
    - State normalization, state fidelity and full-unitary errors agree with an independent spectral reference.
    - Emitted gates, wires, rotation angles and resources match the requested product formula.
    - Trotter spectral errors at N, 2N and 4N obey a conservative remainder bound; observed convergence is conditional on a resolved asymptotic regime.
    - qDrift uses exactly the requested sampling budget and replays with pinned NumPy PCG64 on the same machine.
  outOfScope:
    - Hardware accuracy, quantum advantage and universal single-realization qDrift error guarantees.
    - Exact arithmetic proofs or independent validation of NumPy linear algebra and RNG implementations.
  examples:
    - title: Compare product formulas
      prompt: Compare first and second order Trotter errors at 8 and 16 steps for a real Pauli Hamiltonian.
