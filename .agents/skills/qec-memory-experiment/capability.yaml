  entrypoint: SKILL.md
scope:
  supportedClaims:
    - Counts and Wilson score 95% intervals agree with per-shot logical failures.
    - Circuit and DEM match the requested basis, distance, rounds and four uniform noise channels.
    - Seed replay agrees on the same machine, pinned packages, Stim implementation and single sample batch.
  outOfScope:
    - Error-correction thresholds, hardware performance and cross-machine bitwise reproducibility.
    - Independent proof of Stim or PyMatching algorithms and implementation correctness.
  examples:
    - title: A fixed local memory experiment
      prompt: Compare a noiseless and a noisy distance-3 Z-memory experiment with explicit shots and seed.
