[project]
name = "openquantum-deepquantum-differentiable"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["deepquantum==4.5.0", "torch==2.11.0"]

[tool.uv]
package = false

# Use CPU wheels on platforms where the PyPI torch distribution bundles CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
