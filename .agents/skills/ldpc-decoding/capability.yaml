schemaVersion: "1.1"
id: ldpc-decoding
version: 1.1.0
displayName: ldpc-decoding independent observations
description: Independent observations with persisted evidence and replayable central Acceptance.
maturity:
  status: draft
  evidence:
    - id: independent-observations-2026-11-25
      kind: eval-report
      path: evals/evidence-2026-11-25.json
      sha256: 71abd2999344be8ac4759e027583b5b5b0421266932bd5c0b82c22413dd93ddb
skill:
  name: ldpc-decoding
  entrypoint: SKILL.md
scope:
  supportedClaims:
    - Independently check binary dimensions, GF(2) residuals, Hamming weights,
      convergence consistency and per-sample aggregates.
    - Replay pinned serial BP+LSD in a separate request-only Python process;
      logical flips only against supplied true errors and parity vectors.
  outOfScope:
    - Code thresholds, hardware performance and proof of logical-operator
      correctness.
    - Logical success without supplied errors and parity vectors.
  examples:
    - title: Fixed independent check
      prompt: Run the local fixed case and report independent observations.
