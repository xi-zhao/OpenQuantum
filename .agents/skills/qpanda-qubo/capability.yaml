skill:
  name: qpanda-qubo
  entrypoint: SKILL.md
scope:
  supportedClaims:
    - Independently reconstruct binary objective and squared equality penalties,
      including the constant offset.
    - Independently evaluate returned assignments and exhaustively check global
      penalized and feasible optima for n<=16.
  outOfScope:
    - Global optimum proof above 16 variables, automatic penalty choice,
      inequalities or quantum advantage.
    - QAOA global optimality without independent exhaustive evidence.
  examples:
    - title: Fixed independent check
      prompt: Run the local fixed case and report independent observations.
input:
  id: experiment-request
  schema: inputs/request.schema.json
  maxBytes: 65536
  mediaTypes:
