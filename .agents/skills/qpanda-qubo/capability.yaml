schemaVersion: "1.1"
id: qpanda-qubo
version: 1.1.0
displayName: qpanda-qubo independent observations
description: Independent observations with persisted evidence and replayable central Acceptance.
maturity:
  status: draft
  evidence:
    - id: independent-observations-2026-11-25
      kind: eval-report
